# The wrapper's unit tests and the naming-rule checks. compile_check and the EditMode tests need Unity and run locally.
name: unit tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest the wrapper supports, the one used locally, and the newest.
        python: ["3.8", "3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
